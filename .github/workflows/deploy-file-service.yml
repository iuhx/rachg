name: Deploy rachg-file-service (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'workers/file-service/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-file-service.yml'
  workflow_dispatch:

concurrency:
  group: deploy-file-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @rachg/shared build

      - name: Typecheck Worker
        run: pnpm --filter @rachg/file-service typecheck

      - name: Deploy Worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'workers/file-service'
          command: deploy
